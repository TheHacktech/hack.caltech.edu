name: Build and deploy staging

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-static.yml

  staging:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: publish-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: release
      - name: Publish staging
        id: publish
        run: bash .github/scripts/publish-site.sh staging
      - name: Rebuild GitHub Pages from staging
        if: steps.publish.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
