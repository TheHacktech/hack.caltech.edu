name: Build website

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          name: website
          path: dist/
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: compiled-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: dist
      - name: Update compiled-prod
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          # A slow build may finish after a newer push has reached master.
          current=$(git ls-remote --exit-code origin refs/heads/master | cut -f1)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "Superseded by $current"
            exit 0
          fi

          target="$RUNNER_TEMP/compiled"
          previous=$(git ls-remote origin refs/heads/compiled-prod)
          if [[ -n "$previous" ]]; then
            git fetch --depth=1 origin refs/heads/compiled-prod
            git worktree add --detach "$target" FETCH_HEAD
          else
            git worktree add --orphan -b compiled-prod "$target"
          fi

          rsync -a --delete --exclude=.git dist/ "$target/"
          git -C "$target" add --all
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "Build website from ${GITHUB_SHA:0:12}"
            git -C "$target" push origin HEAD:refs/heads/compiled-prod
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN do not trigger branch-based Pages builds.
      - name: Deploy compiled-prod to GitHub Pages
        if: steps.publish.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
