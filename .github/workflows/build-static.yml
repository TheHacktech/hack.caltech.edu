name: Build static site

on: workflow_call

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # For a manual release, resolve master when the build starts.
          # PRs build the proposed merge, and staging builds the triggering push.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record the source revision alongside the site
        if: github.event_name != 'pull_request'
        run: |
          mkdir release
          mv dist release/site
          git rev-parse HEAD > release/revision
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: website
          path: release/
          include-hidden-files: true
          retention-days: 1
